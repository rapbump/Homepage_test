<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Homepage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        nav {
            background-color: #333;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .hero {
            padding: 100px 20px;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 15px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section class="hero" id="home">
        <h1>Welcome to My Website!</h1>
        <p>This is my simple homepage.</p>
        <button onclick="alert('Welcome!')">
            Get Started
        </button>
    </section>

    <section id="about">
        <h2>About Us</h2>
        <p>This website is created using HTML and CSS.</p>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>
        <p>Email: example@email.com</p>
    </section>

    <footer>
        <p style="color: white;">
            &copy; 2026 My Website
        </p>
    </footer>

</body>
</html>
